name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual fallback: pick the tag under "Use workflow from" to (re)create its
  # release, e.g. after a GitHub Actions outage swallowed the tag push event.
  workflow_dispatch:

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # dist/puffer-card.js is attached as a release asset. Because its name
      # matches "filename" in hacs.json, HACS sets content.path.remote to
      # "release" and content.single to True
      # (repositories/plugin.py::update_filenames), so it installs that single
      # file instead of downloading dist/ from the tagged source. This is only
      # correct because the card bundles Lit and its translations: dist/ must
      # never gain a second file that users would need.
      #
      # To roll back, publish a later release without an asset: HACS falls
      # back to installing from the tagged source.

      - name: Resolve version from tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::This workflow must run on a tag ref, got '${{ github.ref_name }}'."
            exit 1
          fi

          # v1.4.0-beta.1 -> VERSION=1.4.0-beta.1, BASE_VERSION=1.4.0
          # Pre-release notes live under the final version's CHANGELOG section,
          # so lookups always use BASE_VERSION.
          VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION="${VERSION%%-*}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag $GITHUB_REF_NAME -> version=$VERSION, base=$BASE_VERSION"

      - name: Verify package.json matches the tag
        env:
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$BASE_VERSION" ]; then
            echo "::error::package.json version is $PKG_VERSION but the tag says $BASE_VERSION. Bump package.json and re-tag."
            exit 1
          fi
          echo "package.json version $PKG_VERSION matches tag."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Rebuilds with the full tag as the version string, so a pre-release
      # build reports v1.4.0-beta.1 rather than package.json's 1.4.0. The
      # result is not committed: it only matters once an asset is attached.
      - name: Build with the tag version
        env:
          PUFFER_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build

      - name: Verify translations are in the bundle
        run: node scripts/check-translations.js

      # A rename here would silently break HACS installs: the asset would no
      # longer match hacs.json and HACS would quietly go back to installing
      # from source. Fail loudly instead.
      - name: Verify the built file matches hacs.json filename
        run: |
          EXPECTED="$(node -p "require('./hacs.json').filename")"
          ACTUAL="$(basename dist/puffer-card.js)"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::hacs.json filename is '$EXPECTED' but the built asset is '$ACTUAL'."
            exit 1
          fi
          if [ "$(find dist -type f | wc -l)" -ne 1 ]; then
            echo "::error::dist/ must contain exactly one file: HACS installs only the release asset."
            find dist -type f
            exit 1
          fi
          echo "Asset name '$ACTUAL' matches hacs.json, dist/ holds a single file."

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        env:
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          # Grab everything between "## [BASE_VERSION]" and the next "## ["
          # heading, or the block of link definitions at the end of the file
          # ("[x.y.z]: https://..."), whichever comes first, then drop the
          # heading line itself.
          NOTES="$(awk -v ver="$BASE_VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/     { exit }
            found && /^\[[^]]+\]:/ { exit }
            found { print }
          ' CHANGELOG.md)"

          # Strip trailing whitespace on each line, then trim leading/trailing
          # blank lines (handles "## [x.y.z] - date " entries with a stray
          # trailing space on the otherwise-empty line right after the heading).
          NOTES="$(printf '%s\n' "$NOTES" | sed -e 's/[[:space:]]*$//' \
            -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}')"

          # Unwrap hard-wrapped paragraphs. CHANGELOG.md is wrapped at ~80
          # columns, which reads well in the repo because GitHub joins single
          # newlines when rendering a .md file. Release bodies are rendered
          # with hard line breaks instead, where every newline becomes a <br>,
          # so the wrapping would show up as ragged mid-sentence breaks.
          # Fold each block onto one line and let the browser wrap it.
          NOTES="$(printf '%s\n' "$NOTES" | awk '
            function flush() { if (buf != "") { print buf; buf = "" } }
            BEGIN { buf = ""; fence = 0 }
            {
              line = $0

              # Fenced code blocks pass through untouched.
              if (line ~ /^[[:space:]]*(```|~~~)/) { flush(); print line; fence = !fence; next }
              if (fence)                          { flush(); print line; next }

              # Blank line ends the current block.
              if (line ~ /^[[:space:]]*$/) { flush(); print ""; next }

              # Indented code at the start of a block passes through.
              if (buf == "" && line ~ /^    [^[:space:]]/) { print line; next }

              # A continuation line: indented, not a new list item, and with
              # something to attach to. Fold it in with a single space.
              if (buf != "" && line ~ /^[[:space:]]+[^[:space:]]/ &&
                  line !~ /^[[:space:]]*([-*+]|[0-9]+\.)[[:space:]]/) {
                sub(/^[[:space:]]+/, "", line)
                buf = buf " " line
                next
              }

              # Anything else starts a new block.
              flush()
              buf = line
            }
            END { flush() }
          ')"

          if [ -z "$NOTES" ]; then
            echo "::warning::No CHANGELOG.md entry found for version $BASE_VERSION, falling back to auto-generated notes."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "notes<<EOF"
              echo "$NOTES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Puffer Card ${{ github.ref_name }}"
          draft: false
          # Tags carrying a pre-release suffix (v1.4.0-beta.1) are published as
          # pre-releases, so HACS only offers them to users who enabled
          # "Show beta versions".
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Built above with the tag version, so the asset reports the full tag
          # (v1.5.0-beta.1) rather than package.json's base version.
          files: dist/puffer-card.js
          body: ${{ steps.changelog.outputs.notes }}
          # Only fall back to GitHub's auto-generated "Full Changelog" notes
          # when no matching CHANGELOG.md section was found.
          generate_release_notes: ${{ steps.changelog.outputs.found != 'true' }}