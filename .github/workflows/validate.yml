name: Validate

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  # Manual trigger: lets you re-validate main without an empty commit, e.g.
  # after an Actions outage killed a run before any job was assigned — those
  # runs cannot be re-run, since there is no job to re-run.
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # dist/puffer-card.js is committed so that manual installs and HACS
      # installs from the tagged source keep working. This step fails if the
      # committed bundle does not match what src/ currently produces, i.e. if
      # someone edited src/ (or a translation) without rebuilding.
      - name: Check that dist/ is up to date with src/
        run: |
          if ! git diff --exit-code --stat -- dist/; then
            echo "::error::dist/puffer-card.js is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Check JS syntax
        run: node --check --input-type=module < dist/puffer-card.js

      - name: Check translation completeness
        run: node scripts/check-translations.js